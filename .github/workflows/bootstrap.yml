# .github/workflows/bootstrap.yml
---
name: "Bootstrap Remote State"

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    name: "Bootstrap Remote State"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Verify Azure variables
        run: |
          echo "CLIENT_ID_PRESENT=${{ vars.AZURE_CLIENT_ID != '' }}"
          echo "TENANT_ID_PRESENT=${{ vars.AZURE_TENANT_ID != '' }}"
          echo "SUBSCRIPTION_ID_PRESENT=${{ vars.AZURE_SUBSCRIPTION_ID != '' }}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialise without a backend
        run: terraform -chdir=infra/bootstrap init -backend=false

      - name: Terraform Import Existing Resources
        run: |
          chmod +x .github/scripts/import-bootstrap.sh
          bash .github/scripts/import-bootstrap.sh

      - name: Terraform plan
        run: |
          terraform -chdir=infra/bootstrap plan \
            -var-file=environments/platform.tfvars \
            -out=bootstrap.tfplan

      - name: Terraform apply
        run: terraform -chdir=infra/bootstrap apply -auto-approve bootstrap.tfplan

      - name: Export bootstrap outputs as JSON
        id: export
        run: |
          terraform -chdir=infra/bootstrap output -json > bootstrap-outputs.json
          cat bootstrap-outputs.json

      - name: Upload bootstrap outputs
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-outputs
          path: bootstrap-outputs.json

      - name: Generate backend.dev.hcl
        run: |
          RG_NAME=$(jq -r .resource_group_name.value bootstrap-outputs.json)
          SA_NAME=$(jq -r .storage_account_name.value bootstrap-outputs.json)
          cat <<EOF > infra/dev/backend.dev.hcl
          resource_group_name  = "$RG_NAME"
          storage_account_name = "$SA_NAME"
          container_name       = "tfstate"
          key                  = "dev/aks-platform.tfstate"
          use_azuread_auth     = true
          EOF

      - name: Upload backend configuration
        uses: actions/upload-artifact@v4
        with:
          name: backend-config
          path: infra/dev/backend.dev.hcl
