# .github/workflows/helmdeploy.yml
---
name: "Helm Deploy to AKS"

on:
  workflow_call:
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  helmdeploy:
    name: "Helm Deploy to AKS"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download image manifest
        uses: actions/download-artifact@v4
        with:
          name: image-manifest
          path: .

      - name: Retrieve AKS credentials
        run: |
          RG=$(terraform -chdir=infra/dev output -raw resource_group_name)
          AKS=$(terraform -chdir=infra/dev output -raw aks_cluster_name)
          az aks get-credentials \
            --resource-group $RG \
            --name $AKS \
            --overwrite-existing

      - name: Helm lint
        run: helm lint ./deploy/charts/azure-cost-advisor

      - name: Render Helm template (audit artefact)
        run: |
          IMAGE_TAGS=$(cat image-manifest.json \
            | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]')
          helm template azure-cost-advisor ./deploy/charts/azure-cost-advisor \
            --set imageTag="${IMAGE_TAGS}" \
            --namespace finops-edge > helm-manifest.yaml

      - name: Deploy / upgrade Helm release
        run: |
          IMAGE_TAGS=$(cat image-manifest.json \
            | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]')
          helm upgrade --install azure-cost-advisor \
            ./deploy/charts/azure-cost-advisor \
            --namespace finops-edge --create-namespace \
            --set imageTag="${IMAGE_TAGS}"

      - name: Wait for pods to become Ready (max 5 min)
        run: |
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/part-of=azure-cost-advisor \
            -n finops-edge --timeout=300s

      - name: Upload rendered Helm manifest
        uses: actions/upload-artifact@v4
        with:
          name: helm-manifest
          path: helm-manifest.yaml
