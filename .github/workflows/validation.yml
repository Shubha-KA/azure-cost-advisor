# .github/workflows/validation.yml
---
name: "Terraform Validation"

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  validation:
    name: "Terraform Validation"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Verify Azure variables
        run: |
          echo "CLIENT_ID_PRESENT=${{ vars.AZURE_CLIENT_ID != '' }}"
          echo "TENANT_ID_PRESENT=${{ vars.AZURE_TENANT_ID != '' }}"
          echo "SUBSCRIPTION_ID_PRESENT=${{ vars.AZURE_SUBSCRIPTION_ID != '' }}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform fmt (check)
        run: |
          terraform -chdir=infra/bootstrap fmt -check
          terraform -chdir=infra/dev fmt -check

      - name: Terraform init
        run: |
          terraform -chdir=infra/bootstrap init -backend=false
          terraform -chdir=infra/dev init -backend=false

      - name: Terraform validate
        run: |
          terraform -chdir=infra/bootstrap validate
          terraform -chdir=infra/dev validate

      - name: Install tflint
        run: |
          curl -sSL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint -c .tflint.hcl

      - name: Install checkov
        run: |
          pip install checkov
          checkov -d infra/bootstrap -d infra/dev

      - name: Install terraform-docs
        run: |
          curl -sSL https://github.com/terraform-docs/terraform-docs/releases/download/v0.18.0/terraform-docs-v0.18.0-linux-amd64.tar.gz |
          tar -xz -C /usr/local/bin terraform-docs
          terraform-docs check ./infra/bootstrap
          terraform-docs check ./infra/dev
