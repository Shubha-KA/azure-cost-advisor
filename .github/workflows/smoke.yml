# .github/workflows/smoke.yml
---
name: "Smoke Tests"

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    name: "Smoke Tests"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Azure variables
        run: |
          echo "CLIENT_ID_PRESENT=${{ vars.AZURE_CLIENT_ID != '' }}"
          echo "TENANT_ID_PRESENT=${{ vars.AZURE_TENANT_ID != '' }}"
          echo "SUBSCRIPTION_ID_PRESENT=${{ vars.AZURE_SUBSCRIPTION_ID != '' }}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download infra/dev artefact
        uses: actions/download-artifact@v4
        with:
          name: infra-dev
          path: infra/dev

      - name: Retrieve AKS credentials
        run: |
          RG=$(terraform -chdir=infra/dev output -raw resource_group_name)
          AKS=$(terraform -chdir=infra/dev output -raw aks_cluster_name)
          az aks get-credentials \
            --resource-group $RG \
            --name $AKS \
            --overwrite-existing

      - name: Check all pods are Running
        run: |
          kubectl get pods -n finops-edge
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/part-of=azure-cost-advisor \
            -n finops-edge --timeout=120s

      - name: Smoke test – frontend health endpoint
        run: |
          SVC_IP=$(kubectl get svc -n finops-edge \
            -l app=frontend \
            -o jsonpath='{.items[0].status.loadBalancer.ingress[0].ip}')
          if [ -z "$SVC_IP" ]; then
            echo "No external IP yet – falling back to cluster-internal check"
            kubectl run smoke-test --image=curlimages/curl:latest \
              --restart=Never --rm -it \
              -- curl -sf http://frontend.finops-edge.svc.cluster.local/health
          else
            curl -sf http://${SVC_IP}/health
          fi

      - name: Smoke test – collection-service health endpoint
        run: |
          kubectl run collection-smoke --image=curlimages/curl:latest \
            --restart=Never --rm -it \
            -- curl -sf http://collection-service.finops-edge.svc.cluster.local/health

      - name: Smoke test – ai-service health endpoint
        run: |
          kubectl run ai-smoke --image=curlimages/curl:latest \
            --restart=Never --rm -it \
            -- curl -sf http://ai-service.finops-edge.svc.cluster.local/health

      - name: Upload smoke test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: /tmp/smoke-*.log
          if-no-files-found: ignore
