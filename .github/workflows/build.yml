# .github/workflows/build.yml
---
name: "Build & Push Docker Images"

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: "Build & Push Docker Images"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Azure variables
        run: |
          echo "CLIENT_ID_PRESENT=${{ vars.AZURE_CLIENT_ID != '' }}"
          echo "TENANT_ID_PRESENT=${{ vars.AZURE_TENANT_ID != '' }}"
          echo "SUBSCRIPTION_ID_PRESENT=${{ vars.AZURE_SUBSCRIPTION_ID != '' }}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download bootstrap outputs
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-outputs
          path: .

      - name: Retrieve ACR name
        id: acr
        run: |
          RG_NAME=$(jq -r .resource_group_name.value bootstrap-outputs.json)
          SA_NAME=$(jq -r .storage_account_name.value bootstrap-outputs.json)
          cat <<EOF > infra/dev/backend.dev.hcl
          resource_group_name  = "$RG_NAME"
          storage_account_name = "$SA_NAME"
          container_name       = "tfstate"
          key                  = "dev/aks-platform.tfstate"
          use_azuread_auth     = true
          EOF
          terraform -chdir=infra/dev init -reconfigure -backend-config=infra/dev/backend.dev.hcl
          echo "acr=$(terraform -chdir=infra/dev output -raw acr_name)" >> $GITHUB_OUTPUT

      - name: ACR login
        run: az acr login -n ${{ steps.acr.outputs.acr }}

      - name: Build & push collection-service
        run: |
          IMAGE=${{ steps.acr.outputs.acr }}/collection-service:${IMAGE_TAG}
          docker build -f Dockerfile.service -t $IMAGE .
          docker push $IMAGE

      - name: Build & push ai-service
        run: |
          IMAGE=${{ steps.acr.outputs.acr }}/ai-service:${IMAGE_TAG}
          docker build -f Dockerfile.service -t $IMAGE .
          docker push $IMAGE

      - name: Build & push billing-service
        run: |
          IMAGE=${{ steps.acr.outputs.acr }}/billing-service:${IMAGE_TAG}
          docker build -f Dockerfile.service -t $IMAGE .
          docker push $IMAGE

      - name: Build & push expense-service
        run: |
          IMAGE=${{ steps.acr.outputs.acr }}/expense-service:${IMAGE_TAG}
          docker build -f Dockerfile.service -t $IMAGE .
          docker push $IMAGE

      - name: Build & push recommendation-service
        run: |
          IMAGE=${{ steps.acr.outputs.acr }}/recommendation-service:${IMAGE_TAG}
          docker build -f Dockerfile.service -t $IMAGE .
          docker push $IMAGE

      - name: Build & push frontend
        run: |
          IMAGE=${{ steps.acr.outputs.acr }}/frontend:${IMAGE_TAG}
          docker build -f frontend/Dockerfile -t $IMAGE .
          docker push $IMAGE

      - name: Build & push api-gateway
        run: |
          IMAGE=${{ steps.acr.outputs.acr }}/api-gateway:${IMAGE_TAG}
          docker build -f Dockerfile.api -t $IMAGE .
          docker push $IMAGE

      - name: Write image manifest
        run: |
          ACR=${{ steps.acr.outputs.acr }}
          cat > image-manifest.json <<EOF
          {
            "collection-service": "${ACR}/collection-service:${IMAGE_TAG}",
            "ai-service": "${ACR}/ai-service:${IMAGE_TAG}",
            "billing-service": "${ACR}/billing-service:${IMAGE_TAG}",
            "expense-service": "${ACR}/expense-service:${IMAGE_TAG}",
            "recommendation-service": "${ACR}/recommendation-service:${IMAGE_TAG}",
            "frontend": "${ACR}/frontend:${IMAGE_TAG}",
            "api-gateway": "${ACR}/api-gateway:${IMAGE_TAG}"
          }
          EOF

      - name: Upload image manifest
        uses: actions/upload-artifact@v4
        with:
          name: image-manifest
          path: image-manifest.json
