---
# .github/workflows/build.yml
on:
  workflow_call:
    inputs: {}
    secrets: # yamllint disable-rule: truthy
      inherit: true

jobs:
  build:
    name: "📦 Build & Push Docker Images"
    needs: postinfra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-oidc: true

      - name: Retrieve ACR name
        id: acr
        run: |
          echo "acr=$(terraform -chdir=infra/dev output -raw acr_name)" >> $GITHUB_OUTPUT
          RG_NAME=$(jq -r .resource_group_name.value bootstrap-outputs.json)
          SA_NAME=$(jq -r .storage_account_name.value bootstrap-outputs.json)
          cat <<EOF > infra/dev/backend.dev.hcl
          resource_group_name  = "$RG_NAME"
          storage_account_name = "$SA_NAME"
          container_name       = "tfstate"
          key                  = "dev/aks-platform.tfstate"
          use_azuread_auth     = true
          EOF

      - name: ACR login
        run: az acr login -n ${{ steps.acr.outputs.acr }}

      # Build & push each service
      - name: Build & push collection-service
        run: |
          IMAGE=${{ steps.acr.outputs.acr }}/collection-service:${IMAGE_TAG}
          docker build -f Dockerfile.service -t $IMAGE .
          docker push $IMAGE

      - name: Build & push ai-service
        run: |
          IMAGE=${{ steps.acr.outputs.acr }}/ai-service:${IMAGE_TAG}
          docker build -f Dockerfile.service -t $IMAGE .
          docker push $IMAGE

      - name: Build & push billing-service
        run: |
          IMAGE=${{ steps.acr.outputs.acr }}/billing-service:${IMAGE_TAG}
          docker build -f Dockerfile.service -t $IMAGE .
          docker push $IMAGE

      - name: Build & push expense-service
        run: |
          IMAGE=${{ steps.acr.outputs.acr }}/expense-service:${IMAGE_TAG}
          docker build -f Dockerfile.service -t $IMAGE .
          docker push $IMAGE

      - name: Build & push recommendation-service
        run: |
          IMAGE=${{ steps.acr.outputs.acr }}/recommendation-service:${IMAGE_TAG}
          docker build -f Dockerfile.service -t $IMAGE .
          docker push $IMAGE

      - name: Build & push frontend
        run: |
          IMAGE=${{ steps.acr.outputs.acr }}/frontend:${IMAGE_TAG}
          docker build -f frontend/Dockerfile -t $IMAGE .
          docker push $IMAGE

      - name: Build & push API-gateway (if exists)
        run: |
          IMAGE=${{ steps.acr.outputs.acr }}/api-gateway:${IMAGE_TAG}
          docker build -f Dockerfile.api -t $IMAGE .
          docker push $IMAGE

      - name: Write image manifest
        run: |
          cat > image-manifest.json <<EOF # yamllint disable-line rule:line-length
          {
            "collection-service": "${{ steps.acr.outputs.acr }}/collection-service:${IMAGE_TAG}", # yamllint disable-line rule:line-length
            "ai-service": "${{ steps.acr.outputs.acr }}/ai-service:${IMAGE_TAG}", # yamllint disable-line rule:line-length
            "billing-service": "${{ steps.acr.outputs.acr }}/billing-service:${IMAGE_TAG}", # yamllint disable-line rule:line-length
            "expense-service": "${{ steps.acr.outputs.acr }}/expense-service:${IMAGE_TAG}", # yamllint disable-line rule:line-length
            "recommendation-service": "${{ steps.acr.outputs.acr }}/recommendation-service:${IMAGE_TAG}", # yamllint disable-line rule:line-length
            "frontend": "${{ steps.acr.outputs.acr }}/frontend:${IMAGE_TAG}", # yamllint disable-line rule:line-length
            "api-gateway": "${{ steps.acr.outputs.acr }}/api-gateway:${IMAGE_TAG}" # yamllint disable-line rule:line-length
          }
          EOF

      - name: Upload image manifest
        uses: actions/upload-artifact@v4
        with:
          name: image-manifest
          path: image-manifest.json
