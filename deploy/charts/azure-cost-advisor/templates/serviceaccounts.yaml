{{- range $name, $service := .Values.services }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $service.serviceAccount }}
  namespace: {{ $service.namespace }}
  annotations:
    azure.workload.identity/client-id: {{ required (printf "workloadIdentityClientId is required for %s" $name) $service.workloadIdentityClientId | quote }}
  labels:
    {{- include "finops.labels" $ | nindent 4 }}
    {{- include "finops.selectorLabels" (dict "name" $name) | nindent 4 }}
{{- end }}
