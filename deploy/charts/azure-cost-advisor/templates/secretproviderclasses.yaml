{{- range $name, $service := .Values.services }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "finops.secretProviderClassName" (dict "name" $name) }}
  namespace: {{ $service.namespace }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required (printf "workloadIdentityClientId is required for %s" $name) $service.workloadIdentityClientId | quote }}
    keyvaultName: {{ required "global.keyVault.name is required" $.Values.global.keyVault.name | quote }}
    tenantId: {{ required "global.keyVault.tenantId is required" $.Values.global.keyVault.tenantId | quote }}
    objects: |
      array:
      {{- range $envName, $objectName := $service.keyVaultObjects }}
        - |
          objectName: {{ $objectName }}
          objectType: secret
          objectAlias: {{ $objectName }}
      {{- end }}
{{- end }}
