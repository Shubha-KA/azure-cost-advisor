      FRONTEND_URL: frontend-url
      EVENT_PROVIDER: event-provider
      SERVICE_BUS_NAMESPACE: service-bus-namespace
      SERVICE_BUS_TOPIC: service-bus-topic
      INTERNAL_API_AUDIENCE: internal-api-audience
