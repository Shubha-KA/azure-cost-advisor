      USE_MANAGED_IDENTITY: use-managed-identity
      APPLICATIONINSIGHTS_CONNECTION_STRING: applicationinsights-connection-string
      AUTH_MODE: auth-mode
      ENTRA_CLIENT_ID: entra-client-id
