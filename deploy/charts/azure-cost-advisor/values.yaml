global:
  keyVault:
    name: ""
    tenantId: ""
    mountPath: /mnt/secrets-store
  ingress:
    enabled: true
    className: azure-application-gateway
    hostname: ""
    sslCertificateName: ""
    sslRedirect: false

services:
  frontend:
    namespace: finops-edge
    serviceAccount: frontend
    workloadIdentityClientId: ""
    image:
      repository: ""
      tag: latest
    command: node server.js
    keyVaultObjects:
      FRONTEND_URL: frontend-url
    port: 3000
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      cpuUtilization: 70
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
  api-gateway:
    namespace: finops-edge
    serviceAccount: api-gateway
    workloadIdentityClientId: ""
    image:
      repository: ""
      tag: latest
    command: uvicorn src.microservices.gateway_service:app --host 0.0.0.0 --port 8000
    keyVaultObjects:
      STORAGE_PROVIDER: storage-provider
      COSMOS_ENDPOINT: cosmos-endpoint
      COSMOS_DATABASE: cosmos-database
      AZURE_STORAGE_ACCOUNT_URL: azure-storage-account-url
      AZURE_STORAGE_CONTAINER: azure-storage-container
      USE_MANAGED_IDENTITY: use-managed-identity
      APPLICATIONINSIGHTS_CONNECTION_STRING: applicationinsights-connection-string
      AUTH_MODE: auth-mode
      API_SESSION_SECRET: api-session-secret
      INTERNAL_API_AUDIENCE: internal-api-audience
      AUTH_SERVICE_URL: auth-service-url
      COLLECTION_SERVICE_URL: collection-service-url
      PROCESSING_SERVICE_URL: processing-service-url
      AI_SERVICE_URL: ai-service-url
      NOTIFICATION_SERVICE_URL: notification-service-url
    port: 8000
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      cpuUtilization: 70
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 750m, memory: 768Mi }
  auth-service:
    namespace: finops-auth
    serviceAccount: auth-service
    workloadIdentityClientId: ""
    image:
      repository: ""
      tag: latest
