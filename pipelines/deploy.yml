# =============================================================================
# Azure DevOps CD Pipeline — Terraform & Routing Deployment (CD)
# =============================================================================
trigger: none

resources:
  pipelines:
    - pipeline: build-pipeline
      source: "Build Pipeline"
      trigger:
        branches:
          - main

variables:
  terraformVersion: "1.5.7"
  dockerRegistry: "costadvisor.azurecr.io"
  imageRepository: "azure-cost-advisor"
  imageTag: "$(resources.pipeline.build-pipeline.runID)"
  workingDirectory: "$(Build.SourcesDirectory)/azure-cost-advisor"

pool:
  vmImage: "ubuntu-latest"

stages:
  # ---------------------------------------------------------------------------
  # Stage 1: Terraform Init & Plan
  # ---------------------------------------------------------------------------
  - stage: TerraformPlan
    displayName: "Terraform Plan"
    jobs:
      - job: Plan
        displayName: "Terraform Plan"
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: "$(terraformVersion)"
            displayName: "Install Terraform $(terraformVersion)"

          - task: AzureCLI@2
            displayName: "Terraform Init & Plan"
            inputs:
              azureSubscription: "azure-cost-advisor-service-connection"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              workingDirectory: $(workingDirectory)/infra
              inlineScript: |
                terraform init -input=false
                terraform validate
                terraform plan \
                  -input=false \
                  -var="docker_image=$(dockerRegistry)/$(imageRepository):$(imageTag)" \
                  -var="streamlit_port=8501" \
                  -var="azure_openai_api_key=$(AZURE_OPENAI_API_KEY)" \
                  -out=tfplan
            env:
              AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)

          - publish: $(workingDirectory)/infra/tfplan
            artifact: terraform-plan
            displayName: "Publish Terraform Plan"

  # ---------------------------------------------------------------------------
  # Stage 2: Terraform Apply & Gateway Routing Backend Configuration
  # ---------------------------------------------------------------------------
  - stage: TerraformApply
    displayName: "Terraform Apply & Deploy"
    dependsOn: TerraformPlan
    condition: succeeded()
    jobs:
      - deployment: Apply
        displayName: "Apply & Route"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: terraform-plan

                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: "$(terraformVersion)"
                  displayName: "Install Terraform"

                - task: AzureCLI@2
                  displayName: "Terraform Apply"
                  inputs:
                    azureSubscription: "azure-cost-advisor-service-connection"
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    workingDirectory: $(workingDirectory)/infra
                    inlineScript: |
                      terraform init -input=false
                      terraform apply -input=false -auto-approve $(Pipeline.Workspace)/terraform-plan/tfplan
                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)

                - task: AzureCLI@2
                  displayName: "Verify & Configure Gateway Backend"
                  inputs:
                    azureSubscription: "azure-cost-advisor-service-connection"
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      echo "Verifying Application Gateway backend pools and routing configuration..."
                      RG_NAME="rg-cost-advisor-prod"
                      
                      # Find Application Gateway
                      APPGW_NAME=$(az network application-gateway list --resource-group $RG_NAME --query "[0].name" -o tsv)
                      
                      if [ -n "$APPGW_NAME" ]; then
                        echo "Found Application Gateway: $APPGW_NAME"
                        echo "Updating Backend Address Pool configuration if needed..."
                        # Verify backend pool health
                        az network application-gateway show --resource-group $RG_NAME --name $APPGW_NAME --query "backendAddressPools" -o json
                      else
                        echo "Warning: Application Gateway could not be queried directly. Ensure RG exists."
                      fi
